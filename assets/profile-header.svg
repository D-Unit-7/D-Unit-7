<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Dam — Systems, tools and games</title>

  <desc id="description">
    A minimal system diagram highlighting one critical constraint,
    followed by the phrases understand the system, find the constraint,
    and build the useful tool.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    width="1200"
    height="320"
    rx="28"
    fill="url(#background)"
  />

  <rect
    x="1"
    y="1"
    width="1198"
    height="318"
    rx="27"
    fill="none"
    stroke="#30363d"
    stroke-width="2"
  />

  <g
    stroke="#30363d"
    stroke-width="4"
    stroke-linecap="round"
  >
    <line x1="150" y1="95" x2="330" y2="95" />
    <line x1="370" y1="95" x2="550" y2="95" />
    <line x1="590" y1="95" x2="770" y2="95" />
    <line x1="810" y1="95" x2="990" y2="95" />
  </g>

  <g fill="#0d1117" stroke="#8b949e" stroke-width="4">
    <circle cx="130" cy="95" r="18" />
    <circle cx="350" cy="95" r="18" />
    <circle cx="790" cy="95" r="18" />
    <circle cx="1010" cy="95" r="18" />
  </g>

  <circle
    cx="570"
    cy="95"
    r="23"
    fill="url(#accent)"
    filter="url(#glow)"
  />

  <line
    x1="570"
    y1="128"
    x2="570"
    y2="160"
    stroke="#a371f7"
    stroke-width="3"
    stroke-linecap="round"
  />

  <text
    x="570"
    y="184"
    fill="#8b949e"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-size="18"
    text-anchor="middle"
    letter-spacing="2"
  >
    CRITICAL CONSTRAINT
  </text>

  <text
    x="600"
    y="239"
    fill="#f0f6fc"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-size="42"
    font-weight="700"
    text-anchor="middle"
  >
    Understand the system.
  </text>

  <text
    x="600"
    y="278"
    fill="#8b949e"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-size="22"
    text-anchor="middle"
    letter-spacing="1"
  >
    Find the constraint · Build the useful tool
  </text>
</svg>
